<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoTilt – Trading-Checkliste & Journal</title>
<meta name="description" content="Trading-Checkliste und Journal: erst denken, dann traden.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NoTilt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  (function(){ var t = 'cyan'; try { var q = new URLSearchParams(location.search).get('theme'); var s = JSON.parse(localStorage.getItem('tp_theme') || 'null');
    if (q === 'cyan' || q === 'gold'){ t = q; localStorage.setItem('tp_theme', JSON.stringify(q)); } else if (s === 'gold') t = 'gold'; } catch (e) {}
    document.documentElement.dataset.theme = t;
    document.write('<link rel="stylesheet" href="' + (t === 'cyan' ? 'style-cyan.css' : 'style.css') + '">');
    if (t === 'gold') document.write('<meta name="theme-color" content="#07080b">'); })();
  </script>
  <noscript><link rel="stylesheet" href="style-cyan.css"></noscript>
</head>
<body>
<canvas id="bgfx"></canvas>
<canvas id="confetti"></canvas>
<div class="app">
  <div class="top">
    <div class="brand"><svg class="mark" viewBox="6 56 186 92" aria-hidden="true"><path class="zz" d="M16 122 L38 70 L56 134 L74 84 L92 116 L106 100" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M106 100 H174" stroke="#00e5ff" stroke-width="13" stroke-linecap="round"/><circle class="dt" cx="176" cy="100" r="12" fill="#00e5ff"/></svg>NoTilt<span class="sync" id="sync"><i></i><span>Verbinde…</span></span></div>
    <div class="nav">
      <button onclick="go('home')">Start</button>
      <button onclick="go('journal')">Journal</button>
      <button onclick="go('profile')">Profil</button>
      <button onclick="go('settings')">⚙︎</button>
    </div>
  </div>
  <div class="progress" id="progress"><div class="phases" id="phases"></div></div>
  <div class="stage" id="stage"></div>
</div>
<div class="modal" id="modal"><div class="card" id="modalc"></div></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
